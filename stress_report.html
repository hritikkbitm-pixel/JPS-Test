
<!DOCTYPE html>
<html>
<head>
    <title>Stress Test Report</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .container { max_width: 800px; margin: 0 auto; }
        h1 { text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Website Performance Stress Test</h1>
        <canvas id="perfChart"></canvas>
    </div>
    <script>
        const ctx = document.getElementById('perfChart').getContext('2d');
        const data = {
            labels: [1, 501, 1001, 1501, 2001, 2501, 3001, 3501, 4001, 4501],
            datasets: [
                {
                    label: 'Avg Latency (ms)',
                    data: [4.178712174699113, 49.37538186490239, 40.45172528122161, 48.43697734385229, 46.06426155036683, 52.475290089832214, 44.04806826249221, 42.260726062810164, 45.99286945242631, 50.3356845482536],
                    borderColor: 'rgb(255, 99, 132)',
                    yAxisID: 'y'
                },
                {
                    label: 'Requests Per Second (RPS)',
                    data: [61.666666666666664, 2542.0, 3096.6666666666665, 2804.3333333333335, 3176.0, 2956.0, 3094.6666666666665, 3223.3333333333335, 3166.6666666666665, 3128.0],
                    borderColor: 'rgb(54, 162, 235)',
                    yAxisID: 'y1'
                }
            ]
        };
        
        new Chart(ctx, {
            type: 'line',
            data: data,
            options: {
                responsive: true,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                scales: {
                    y: {
                        type: 'linear',
                        display: true,
                        position: 'left',
                        title: { display: true, text: 'Latency (ms)' }
                    },
                    y1: {
                        type: 'linear',
                        display: true,
                        position: 'right',
                        title: { display: true, text: 'RPS' },
                        grid: {
                            drawOnChartArea: false,
                        },
                    },
                }
            }
        });
    </script>
</body>
</html>
